# Set to true on personal machines to also install private packages
is_private_machine: false

apt_packages:
  # basic tools
  - vim
  - htop
  - screenfetch
  - git

  # Useful tools
  - filezilla
  - meld
  - kdiff3
  - shutter
  - remmina
  - gparted
  - shellcheck
  - gimp
  - libimage-exiftool-perl
  - ripgrep

  # network
  - curl
  - iproute2
  - nmap
  - speedtest-cli

  # automotive
  - dlt-viewer

apt_packages_private:
  - anki # Not available on Ubuntu 25.04
  - rpi-imager # Not available on Debian 13.1

flatpak_packages:
  - net.werwolv.ImHex

flatpak_packages_private:
  - com.brave.Browser
  - com.discordapp.Discord
  - com.spotify.Client


# Roles variables
## geerlingguy.docker
# Docker's Linux Mint repository is Ubuntu-based, so it needs UBUNTU_CODENAME rather
# than Mint's distribution_release.
docker_apt_release: "{{ ubuntu_codename if ansible_facts['distribution'] == 'Linux Mint' else ansible_facts['distribution_release'] }}"
docker_users:
  - "{{ ansible_user }}"