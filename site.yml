---
- hosts: "{{ target_hosts }}"
  become: yes

  pre_tasks:
    - name: Set ubuntu_codename fact
      import_role:
        name: ubuntu-codename
      tags: always

    - name: Run essential setup
      import_tasks: tasks/essential.yml
      tags: essential

  roles:
    - { role: geerlingguy.pip, tags: pip }
    - role: geerlingguy.docker
      vars:
        docker_users: "{{ [] if ansible_facts['distribution'] == 'Linux Mint' else docker_users_to_add }}"
      tags: docker
    - { role: dotfiles, tags: dotfiles }
    - { role: bashrc, tags: bashrc }
    - { role: kitty, tags: kitty }
    - { role: tmux, tags: tmux }
    - { role: chrome, tags: chrome }
    - { role: coolercontrol, tags: coolercontrol }
    - { role: fzf, tags: fzf }
    - { role: grub-customizer, tags: grub-customizer }
    - { role: klogg, tags: klogg }
    # - { role: nomachine, tags: nomachine } # not working due to different links and 14 day trial license
    - { role: sublime, tags: sublime }
    - { role: tailscale, tags: tailscale }
    - { role: virtualbox, tags: virtualbox }
    - { role: vscode, tags: vscode }
    - { role: wireshark, tags: wireshark }
    - { role: copyq, tags: copyq }

  post_tasks:
    - name: Add Docker users to the docker group on Linux Mint
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users_to_add }}"
      register: _mint_docker_user_membership
      when: ansible_facts['distribution'] == 'Linux Mint'
      tags: docker

    - name: Reset SSH connection after adding Docker users on Linux Mint
      ansible.builtin.meta: reset_connection
      when:
        - ansible_facts['distribution'] == 'Linux Mint'
        - _mint_docker_user_membership is changed
      tags: docker

    - name: Run private applications
      include_tasks: tasks/private.yml
      when: is_private_machine
      tags: private
